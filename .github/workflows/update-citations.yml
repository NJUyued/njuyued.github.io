name: Update Google Scholar Citations

on:
  schedule:
    - cron: "37 2 * * *"   # daily at 02:37 UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch citations
        run: python scripts/fetch_citations.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gs_data.json
          git diff --staged --quiet || (git commit -m "Auto-update Google Scholar citations" && git push)
